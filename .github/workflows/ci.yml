name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # arm64 is cross-compiled from the x64 runner; the windows-2022 image
        # ships Microsoft.VisualStudio.Component.VC.Tools.ARM64.
        arch: [ x64, x86, arm64 ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # The same script developers run locally; msvc-dev-cmd has already put
      # the toolchain on PATH, so vcvars must not be replayed on top of it.
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Arch ${{ matrix.arch }} -SkipVcvars

      - name: Check the plugin exports what Far looks for
        shell: pwsh
        run: |
          # -join matters: with an array on the left, -notmatch filters instead
          # of returning a boolean, and every name would look missing.
          $exports = (& dumpbin /nologo /exports build/${{ matrix.arch }}/Burlak.dll) -join "`n"
          $required = @('GetGlobalInfoW','SetStartupInfoW','GetPluginInfoW','OpenW','ProcessConsoleInputW','ExitFARW')
          $missing = $required | Where-Object { $exports -notmatch "\b$_\b" }
          if ($missing) { throw "missing exports: $($missing -join ', ')" }
          Write-Host "all $($required.Count) exports present"

      # The archive holds a ready-to-drop Burlak\ folder, so it unpacks straight
      # into Far's Plugins directory. Version comes from the header, not the
      # tag, so untagged builds are still identifiable.
      - name: Package
        shell: pwsh
        run: |
          $h = Get-Content src/version.h -Raw
          $major = [regex]::Match($h, 'BURLAK_VERSION_MAJOR\s+(\d+)').Groups[1].Value
          $minor = [regex]::Match($h, 'BURLAK_VERSION_MINOR\s+(\d+)').Groups[1].Value
          $patch = [regex]::Match($h, 'BURLAK_VERSION_PATCH\s+(\d+)').Groups[1].Value
          $name = "Burlak-$major.$minor.$patch-${{ matrix.arch }}"

          $stage = "stage/Burlak"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/${{ matrix.arch }}/Burlak.dll $stage
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path stage/Burlak -DestinationPath "$name.zip" -Force

          "PACKAGE_NAME=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      # The tag is the source of truth for a release, but src/version.h is the
      # source of truth for the binary. Refuse to publish if they disagree.
      - name: Tag must match src/version.h
        run: |
          major=$(grep -oP 'BURLAK_VERSION_MAJOR\s+\K\d+' src/version.h)
          minor=$(grep -oP 'BURLAK_VERSION_MINOR\s+\K\d+' src/version.h)
          patch=$(grep -oP 'BURLAK_VERSION_PATCH\s+\K\d+' src/version.h)
          header="$major.$minor.$patch"
          tag="${GITHUB_REF_NAME#v}"
          echo "header=$header tag=$tag"
          if [ "$header" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src/version.h ($header)"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: Burlak ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.zip
