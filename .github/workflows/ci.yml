name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # These matrix expansions are required checks named build (x64), build (x86), build (arm64).
    name: build (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]

    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Arch ${{ matrix.arch }}

      - name: Check the seven Far and Renewal exports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path (Join-Path $installation 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw 'dumpbin.exe was not found through Visual Studio setup' }
          $exports = (& $dumpbin /nologo /exports build/release-${{ matrix.arch }}/Burlak.dll) -join "`n"
          $required = @(
            'GetGlobalInfoW', 'SetStartupInfoW', 'GetPluginInfoW', 'OpenW',
            'ProcessConsoleInputW', 'ProcessSynchroEventW', 'ExitFARW'
          )
          $missing = $required | Where-Object { $exports -notmatch "\b$_\b" }
          if ($missing) { throw "missing exports: $($missing -join ', ')" }
          Write-Output "all $($required.Count) exports present"

      - name: Package
        shell: pwsh
        run: |
          $name = ./scripts/package.ps1 -Arch ${{ matrix.arch }}
          "PACKAGE_NAME=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip
          if-no-files-found: error

  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Find Visual Studio LLVM
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          $llvm = Join-Path $installation 'VC\Tools\Llvm\x64\bin'
          "LLVM_DIR=$llvm" >> $env:GITHUB_ENV

      - name: Configure coverage
        shell: pwsh
        run: |
          cmake --preset coverage `
            "-DCMAKE_CXX_COMPILER=$env:LLVM_DIR\clang-cl.exe" `
            "-DCMAKE_RC_COMPILER=$env:LLVM_DIR\llvm-rc.exe" `
            "-DCMAKE_LINKER=$env:LLVM_DIR\lld-link.exe"

      - name: Build coverage
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage --output-on-failure

      - name: Enforce coverage
        shell: pwsh
        run: ./scripts/coverage.ps1 -LlvmDir $env:LLVM_DIR

  lint:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Install analyzers
        shell: pwsh
        run: |
          choco install cppcheck --no-progress -y
          dotnet tool install --global Microsoft.CodeAnalysis.BinSkim
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Find Visual Studio LLVM
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          $llvm = Join-Path $installation 'VC\Tools\Llvm\x64\bin'
          "LLVM_DIR=$llvm" >> $env:GITHUB_ENV

      - name: Build analyzer inputs
        shell: pwsh
        run: |
          cmake --preset debug `
            "-DCMAKE_CXX_COMPILER=$env:LLVM_DIR\clang-cl.exe" `
            "-DCMAKE_RC_COMPILER=$env:LLVM_DIR\llvm-rc.exe" `
            "-DCMAKE_LINKER=$env:LLVM_DIR\lld-link.exe"
          cmake --build --preset debug
          foreach ($arch in 'x64', 'x86', 'arm64') {
            ./scripts/build.ps1 -Arch $arch
          }

      - name: Lint
        shell: pwsh
        run: ./scripts/lint.ps1 -BuildDir build/debug -ReleaseDirs build/release-x64,build/release-x86,build/release-arm64 -LlvmDir $env:LLVM_DIR

  release:
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - name: Tag must match src/plugin/version.h
        run: |
          major=$(grep -oP 'BURLAK_VERSION_MAJOR\s+\K\d+' src/plugin/version.h)
          minor=$(grep -oP 'BURLAK_VERSION_MINOR\s+\K\d+' src/plugin/version.h)
          patch=$(grep -oP 'BURLAK_VERSION_PATCH\s+\K\d+' src/plugin/version.h)
          header="$major.$minor.$patch"
          tag="${GITHUB_REF_NAME#v}"
          echo "header=$header tag=$tag"
          if [ "$header" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src/plugin/version.h ($header)"
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          name: Burlak ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.zip
